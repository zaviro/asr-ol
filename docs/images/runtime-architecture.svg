<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1400" viewBox="0 0 1900 1400" role="img" aria-labelledby="title desc">
  <title id="title">VoxKeep 架构与运行流程图</title>
  <desc id="desc">展示麦克风音频经采集、三路扇出、唤醒、语音活动检测、FunASR 转写、捕获状态机、注入和存储的完整流程，以及启动关闭顺序。</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111e"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="bootstrapFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172554"/>
      <stop offset=".55" stop-color="#15375b"/>
      <stop offset="1" stop-color="#19364c"/>
    </linearGradient>
    <marker id="arrowAudio" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowEvent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowCommand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#fb923c"/>
    </marker>
    <marker id="arrowStore" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4ade80"/>
    </marker>
    <style>
      .sans { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .title { fill: #f8fafc; font-size: 42px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 19px; }
      .boundary-title { fill: #dbeafe; font-size: 18px; font-weight: 700; letter-spacing: .8px; }
      .node-title { fill: #f8fafc; font-size: 22px; font-weight: 700; }
      .node-sub { fill: #cbd5e1; font-size: 16px; }
      .node-dim { fill: #94a3b8; font-size: 15px; }
      .queue { fill: #e0f2fe; font-size: 15px; font-weight: 700; }
      .event { fill: #ede9fe; font-size: 15px; font-weight: 700; }
      .command { fill: #ffedd5; font-size: 15px; font-weight: 700; }
      .store { fill: #dcfce7; font-size: 15px; font-weight: 700; }
      .small { fill: #cbd5e1; font-size: 14px; }
      .life { fill: #dbeafe; font-size: 15px; }
      .flow-audio { fill: none; stroke: #38bdf8; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowAudio); }
      .flow-event { fill: none; stroke: #a78bfa; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowEvent); }
      .flow-command { fill: none; stroke: #fb923c; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowCommand); }
      .flow-store { fill: none; stroke: #4ade80; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowStore); }
      .host-card { fill: #101c30; stroke: #334a67; stroke-width: 2; }
      .ext-card { fill: #171d2c; stroke: #475569; stroke-width: 2; }
      .line { stroke: #334155; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1900" height="1400" fill="url(#bg2)"/>
  <circle cx="1760" cy="65" r="190" fill="#8b5cf6" opacity=".05"/>
  <circle cx="100" cy="1320" r="240" fill="#0ea5e9" opacity=".035"/>

  <text x="55" y="66" class="sans title">VoxKeep 架构与运行流程</text>
  <text x="55" y="101" class="sans subtitle">宿主 Python 模块化单体 + 外部 FunASR · 线程 / 有界队列 / 类型化事件</text>
  <g transform="translate(1320 50)">
    <line x1="0" y1="10" x2="40" y2="10" class="flow-audio"/>
    <text x="52" y="16" class="sans small">音频帧</text>
    <line x1="142" y1="10" x2="182" y2="10" class="flow-event"/>
    <text x="194" y="16" class="sans small">事件</text>
    <line x1="274" y1="10" x2="314" y2="10" class="flow-command"/>
    <text x="326" y="16" class="sans small">命令</text>
    <line x1="406" y1="10" x2="446" y2="10" class="flow-store"/>
    <text x="458" y="16" class="sans small">持久化</text>
  </g>

  <!-- Process and external boundaries -->
  <rect x="180" y="135" width="1300" height="1180" rx="28" fill="#0a1424" stroke="#325176" stroke-width="2.5"/>
  <rect x="205" y="118" width="350" height="36" rx="18" fill="#15375b" stroke="#3b82f6"/>
  <text x="228" y="143" class="sans boundary-title">LINUX HOST · VOXKEEP PYTHON PROCESS</text>

  <rect x="1510" y="135" width="340" height="1180" rx="28" fill="#0e1421" stroke="#475569" stroke-width="2" stroke-dasharray="9 7"/>
  <rect x="1540" y="118" width="208" height="36" rx="18" fill="#252b3d" stroke="#64748b"/>
  <text x="1563" y="143" class="sans boundary-title">外部服务 / 桌面系统</text>

  <!-- Flow connectors, drawn before nodes -->
  <path class="flow-audio" d="M145 405H220"/>
  <path class="flow-audio" d="M470 405H520"/>
  <path class="flow-audio" d="M700 405H755"/>

  <path d="M915 462V500H355V545" class="flow-audio"/>
  <path d="M915 462V500H735V545" class="flow-audio"/>
  <path d="M915 462V500H1165V545" class="flow-audio"/>

  <path d="M1370 605H1535" class="flow-audio"/>
  <path d="M1535 665H1370" class="flow-event"/>

  <path d="M355 695V765" class="flow-event"/>
  <path d="M735 695V765" class="flow-event"/>
  <path d="M1165 715V765" class="flow-event"/>
  <path d="M770 830V855" class="flow-event"/>

  <path d="M770 1010V1040H460V1070" class="flow-command"/>
  <path d="M770 1010V1040H1095V1070" class="flow-store"/>
  <path d="M660 1135H700V1025H1470V1097H1535" class="flow-command"/>
  <path d="M1310 1135H1425V1230H1535" class="flow-store"/>

  <path d="M1370 690H1435V1118H1310" class="flow-store"/>

  <!-- Microphone -->
  <rect x="15" y="350" width="130" height="110" rx="18" class="ext-card"/>
  <circle cx="80" cy="383" r="16" fill="#38bdf8" opacity=".2" stroke="#38bdf8"/>
  <rect x="74" y="369" width="12" height="25" rx="6" fill="#7dd3fc"/>
  <path d="M64 387c0 11 7 19 16 19s16-8 16-19M80 406v10M69 416h22" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
  <text x="80" y="437" text-anchor="middle" class="sans node-sub">麦克风设备</text>

  <!-- Bootstrap strip -->
  <rect x="220" y="175" width="1220" height="110" rx="20" fill="url(#bootstrapFill)" stroke="#3b82f6" stroke-width="2"/>
  <text x="248" y="214" class="mono node-title">bootstrap / AppRuntime</text>
  <text x="248" y="244" class="sans node-sub">组合根：队列 · stop signals · worker 接线 / 健康监督 / 分阶段启停</text>
  <line x1="760" y1="195" x2="760" y2="263" class="line"/>
  <text x="790" y="217" class="mono node-sub">shared</text>
  <text x="790" y="245" class="sans node-dim">dataclass 事件 · PyYAML 配置 · 非阻塞队列工具</text>
  <rect x="1210" y="197" width="196" height="40" rx="20" fill="#0e2945" stroke="#38bdf8"/>
  <text x="1308" y="223" text-anchor="middle" class="sans node-sub">CLI · argparse</text>

  <rect x="220" y="300" width="1220" height="42" rx="12" fill="#0d2133" stroke="#26506b"/>
  <text x="830" y="327" text-anchor="middle" class="sans small">所有运行时队列均有界；生产者使用非阻塞 put，满载时丢弃并记录告警/计数</text>

  <!-- Audio engine -->
  <rect x="220" y="355" width="250" height="107" rx="18" class="host-card"/>
  <rect x="220" y="355" width="7" height="107" rx="3.5" fill="#38bdf8"/>
  <text x="240" y="388" class="mono node-title" style="font-size:17px">SoundDeviceAudioSource</text>
  <text x="246" y="416" class="sans node-sub">sounddevice / PortAudio</text>
  <text x="246" y="442" class="sans node-dim">callback 只复制并入队</text>

  <rect x="520" y="372" width="180" height="67" rx="16" fill="#0d3347" stroke="#38bdf8" stroke-width="2"/>
  <text x="610" y="399" text-anchor="middle" class="mono queue">raw_queue</text>
  <text x="610" y="423" text-anchor="middle" class="mono node-dim">RawAudioChunk</text>

  <rect x="755" y="355" width="320" height="107" rx="18" class="host-card"/>
  <rect x="755" y="355" width="7" height="107" rx="3.5" fill="#38bdf8"/>
  <text x="781" y="388" class="mono node-title">AudioBus + Preprocessor</text>
  <text x="781" y="416" class="sans node-sub">NumPy：mono · int16 · float32</text>
  <text x="781" y="442" class="sans node-dim">单次预处理，同一帧独立扇出</text>

  <!-- Queue pills -->
  <rect x="274" y="491" width="162" height="34" rx="17" fill="#0d3347" stroke="#38bdf8"/>
  <text x="355" y="514" text-anchor="middle" class="mono queue">wake_audio</text>
  <rect x="654" y="491" width="162" height="34" rx="17" fill="#0d3347" stroke="#38bdf8"/>
  <text x="735" y="514" text-anchor="middle" class="mono queue">vad_audio</text>
  <rect x="1084" y="491" width="162" height="34" rx="17" fill="#0d3347" stroke="#38bdf8"/>
  <text x="1165" y="514" text-anchor="middle" class="mono queue">asr_audio</text>

  <!-- Analysis workers -->
  <rect x="210" y="545" width="290" height="150" rx="18" class="host-card"/>
  <rect x="210" y="545" width="7" height="150" rx="3.5" fill="#a78bfa"/>
  <text x="236" y="580" class="mono node-title">OpenWakeWordWorker</text>
  <text x="236" y="610" class="sans node-sub">openWakeWord · ONNX</text>
  <text x="236" y="638" class="sans node-dim">逐规则阈值与动作路由</text>
  <rect x="236" y="654" width="128" height="27" rx="13" fill="#2b2351" stroke="#8b5cf6"/>
  <text x="300" y="673" text-anchor="middle" class="mono event">WakeEvent</text>

  <rect x="580" y="545" width="310" height="150" rx="18" class="host-card"/>
  <rect x="580" y="545" width="7" height="150" rx="3.5" fill="#a78bfa"/>
  <text x="606" y="580" class="mono node-title">SileroVadWorker</text>
  <text x="606" y="610" class="sans node-sub">Silero VAD + Torch</text>
  <text x="606" y="638" class="sans node-dim">应用级句子边界 · energy fallback</text>
  <rect x="606" y="654" width="118" height="27" rx="13" fill="#2b2351" stroke="#8b5cf6"/>
  <text x="665" y="673" text-anchor="middle" class="mono event">VadEvent</text>

  <rect x="960" y="545" width="410" height="170" rx="18" class="host-card"/>
  <rect x="960" y="545" width="7" height="170" rx="3.5" fill="#38bdf8"/>
  <text x="986" y="580" class="mono node-title">TranscriptionWorker</text>
  <text x="986" y="610" class="mono node-sub">FunAsrWsEngine · asyncio / websockets</text>
  <text x="986" y="638" class="sans node-dim">持续发送 PCM；指数退避重连</text>
  <text x="986" y="664" class="sans node-dim">2-pass final · 本地时间戳补偿</text>
  <rect x="986" y="677" width="160" height="27" rx="13" fill="#2b2351" stroke="#8b5cf6"/>
  <text x="1066" y="696" text-anchor="middle" class="mono event">AsrFinalEvent</text>

  <!-- Unified event queue -->
  <rect x="340" y="765" width="860" height="65" rx="18" fill="#241f45" stroke="#8b5cf6" stroke-width="2"/>
  <text x="770" y="792" text-anchor="middle" class="mono event">capture_events</text>
  <text x="770" y="816" text-anchor="middle" class="sans node-dim">WakeEvent | VadEvent | AsrFinalEvent</text>

  <!-- Capture -->
  <rect x="420" y="855" width="700" height="155" rx="20" class="host-card"/>
  <rect x="420" y="855" width="8" height="155" rx="4" fill="#fb923c"/>
  <text x="448" y="891" class="mono node-title">CaptureWorker</text>
  <line x1="448" y1="909" x2="1090" y2="909" class="line"/>
  <text x="448" y="939" class="sans node-sub">Wake / VAD → CaptureFSM</text>
  <text x="448" y="966" class="mono node-dim">IDLE → ARMED → CAPTURING → FINALIZING</text>
  <text x="795" y="939" class="sans node-sub">ASR final → TranscriptExtractor</text>
  <text x="795" y="966" class="sans node-dim">VAD 历史重放 · 1 秒迟到转写宽限</text>
  <rect x="916" y="974" width="174" height="27" rx="13" fill="#4a2b1f" stroke="#fb923c"/>
  <text x="1003" y="993" text-anchor="middle" class="mono command">CaptureCommand</text>

  <!-- Outputs -->
  <rect x="260" y="1070" width="400" height="130" rx="18" class="host-card"/>
  <rect x="260" y="1070" width="7" height="130" rx="3.5" fill="#fb923c"/>
  <text x="286" y="1105" class="mono node-title">InjectorWorker</text>
  <text x="286" y="1135" class="sans node-sub">stdlib subprocess</text>
  <text x="286" y="1163" class="sans node-dim">X11: xdotool · Wayland: ydotool</text>
  <text x="286" y="1188" class="sans node-dim">或执行 openclaw agent</text>

  <rect x="880" y="1070" width="430" height="130" rx="18" class="host-card"/>
  <rect x="880" y="1070" width="7" height="130" rx="3.5" fill="#4ade80"/>
  <text x="906" y="1105" class="mono node-title">SqliteStorageWorker</text>
  <text x="906" y="1135" class="sans node-sub">stdlib sqlite3 · 单写线程</text>
  <text x="906" y="1163" class="sans node-dim">WAL / NORMAL · 批量与定时提交</text>
  <text x="906" y="1188" class="sans node-dim">stream final + capture command</text>

  <!-- Lifecycle strip -->
  <rect x="220" y="1230" width="1220" height="62" rx="16" fill="#101f35" stroke="#315078"/>
  <text x="246" y="1255" class="sans life">启动（消费者优先）：storage → capture → injection → wake → VAD → transcription → audio</text>
  <text x="246" y="1280" class="sans life">关闭（生产者优先）：audio 排空 → analysis → capture → outputs</text>

  <!-- External systems -->
  <rect x="1535" y="485" width="290" height="245" rx="20" class="ext-card"/>
  <rect x="1535" y="485" width="290" height="55" rx="20" fill="#30265c"/>
  <rect x="1535" y="522" width="290" height="18" fill="#30265c"/>
  <text x="1680" y="520" text-anchor="middle" class="sans node-title">FunASR 服务</text>
  <text x="1560" y="570" class="sans node-sub">Docker / 外部 WebSocket</text>
  <text x="1560" y="600" class="sans node-dim">Paraformer online + offline</text>
  <text x="1560" y="628" class="sans node-dim">FSMN VAD：服务内部分段</text>
  <text x="1560" y="656" class="sans node-dim">标点 · LM · ITN</text>
  <text x="1560" y="690" class="mono node-dim">host 10096 → container 10095</text>
  <text x="1450" y="590" text-anchor="end" class="sans small">PCM / WebSocket</text>
  <text x="1450" y="653" text-anchor="end" class="sans small">offline final</text>

  <rect x="1535" y="1045" width="290" height="105" rx="18" class="ext-card"/>
  <text x="1680" y="1083" text-anchor="middle" class="sans node-title">桌面 / 动作目标</text>
  <text x="1680" y="1114" text-anchor="middle" class="sans node-dim">当前输入框或 openclaw</text>

  <rect x="1535" y="1180" width="290" height="105" rx="18" class="ext-card"/>
  <text x="1680" y="1218" text-anchor="middle" class="sans node-title">SQLite + JSONL</text>
  <text x="1680" y="1249" text-anchor="middle" class="sans node-dim">唯一写入路径：storage 模块</text>

  <!-- Direct storage note -->
  <rect x="1320" y="805" width="125" height="55" rx="13" fill="#123024" stroke="#22c55e"/>
  <text x="1382" y="828" text-anchor="middle" class="mono store">ASR final</text>
  <text x="1382" y="849" text-anchor="middle" class="sans small">直接存 stream</text>
</svg>
