name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ------------------------------------------------------------------
  # Fast feedback: lint, format, typecheck, shellcheck, actionlint
  # ------------------------------------------------------------------
  check:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup

      - name: Sync dev dependencies
        run: make sync

      - name: Lint (Ruff)
        run: make lint

      - name: Format check (Ruff)
        run: make fmt-check

      - name: Typecheck (Pyright)
        run: make typecheck

      - name: Shellcheck
        run: make shellcheck

      - name: Actionlint
        run: make actionlint

  # ------------------------------------------------------------------
  # Tests with coverage
  # ------------------------------------------------------------------
  test:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup

      - name: Sync dev dependencies
        run: make sync

      - name: Test with coverage
        run: make test-cov

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  # ------------------------------------------------------------------
  # Security audit
  # ------------------------------------------------------------------
  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup

      - name: Sync dev dependencies
        run: make sync

      - name: Detect committed private keys
        run: uv run pre-commit run detect-private-key --all-files

      - name: Audit GitHub Actions workflows (zizmor)
        run: |
          curl -LsSf https://github.com/woodruffw/zizmor/releases/latest/download/zizmor-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./zizmor --pedantic .github/workflows/*.yml

  # ------------------------------------------------------------------
  # Runtime AI validation — only when AI-related files changed
  # ------------------------------------------------------------------
  runtime-ai:
    name: Runtime AI validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ""

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: ./.github/actions/setup

      - name: Detect AI-related changes
        id: changes
        run: |
          if git diff --name-only origin/main...HEAD 2>/dev/null |
             grep -qE '^(src/voxkeep/modules/(audio_engine|capture)/|scripts/(setup_openwakeword|check_runtime_ai)|pyproject\.toml|\.github/workflows/ci\.yml)'; then
            echo "ai=true" >> "$GITHUB_OUTPUT"
          else
            echo "ai=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync runtime-ai dependencies
        if: steps.changes.outputs.ai == 'true'
        run: make sync-ai

      - name: Prepare wake model assets
        if: steps.changes.outputs.ai == 'true'
        run: make setup-ai-models

      - name: Runtime AI import check
        if: steps.changes.outputs.ai == 'true'
        run: make check-ai
