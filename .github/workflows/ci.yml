name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ------------------------------------------------------------------
  # Fast feedback: lint, format, typecheck, shellcheck, actionlint
  # ------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: ./.github/actions/setup

      - name: Sync dev dependencies
        run: make sync

      - name: Lint (Ruff)
        run: make lint

      - name: Format check (Ruff)
        run: make fmt-check

      - name: Typecheck (Pyright)
        run: make typecheck

      - name: Shellcheck
        run: make shellcheck

      - name: Actionlint
        run: make actionlint

  # ------------------------------------------------------------------
  # Tests with coverage
  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: ./.github/actions/setup

      - name: Sync dev dependencies
        run: make sync

      - name: Test with coverage
        run: make test-cov

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  # ------------------------------------------------------------------
  # Runtime AI validation — only when AI-related files changed
  # ------------------------------------------------------------------
  runtime-ai:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""

    steps:
      - uses: ./.github/actions/setup

      - name: Detect AI-related changes
        id: changes
        run: |
          if git diff --name-only origin/main...HEAD 2>/dev/null |
             grep -qE '^(src/voxkeep/infra/(wake|vad|audio)/|scripts/(setup_openwakeword|check_runtime_ai)|pyproject\.toml|\.github/workflows/ci\.yml)'; then
            echo "ai=true" >> "$GITHUB_OUTPUT"
          else
            echo "ai=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync runtime-ai dependencies
        if: steps.changes.outputs.ai == 'true'
        run: make sync-ai

      - name: Prepare wake model assets
        if: steps.changes.outputs.ai == 'true'
        run: make setup-ai-models

      - name: Runtime AI import check
        if: steps.changes.outputs.ai == 'true'
        run: make check-ai
