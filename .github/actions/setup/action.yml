name: Setup
description: "Set up Python 3.11 and uv with cache after checkout"

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
